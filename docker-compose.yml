services:
  nhavis:
    image: node:22-alpine
    container_name: nhavis
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      SECURE_COOKIES: "false"
      # Force polling so Next.js detects file changes through Docker on macOS/Windows
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Mount source for live reload
      - .:/app
      # Keep node_modules inside the container (avoids host/container arch conflicts)
      - node_modules:/app/node_modules
      # Persist uploaded photos across restarts
      - uploads:/app/public/uploads

volumes:
  uploads:
    driver: local
  node_modules:
    driver: local
